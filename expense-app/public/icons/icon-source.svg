<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#062a45"/>
      <stop offset="25%"  stop-color="#005a91"/>
      <stop offset="50%"  stop-color="#007AC3"/>
      <stop offset="78%"  stop-color="#409BD2"/>
      <stop offset="94%"  stop-color="#85BC20"/>
      <stop offset="100%" stop-color="#a8d940"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.85">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="1.05" r="0.95">
      <stop offset="0%"   stop-color="#001a2e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#001a2e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="47%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="53%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rupeeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f3ff"/>
    </linearGradient>

    <filter id="rupeeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect width="512" height="512" rx="116" fill="url(#vignette)"/>
  <rect width="512" height="512" rx="116" fill="url(#sweep)"/>
  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>
  <rect x="10" y="10" width="492" height="492" rx="108"
        fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <text x="256" y="368"
        font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"
        font-size="336" font-weight="900"
        fill="url(#rupeeFill)" text-anchor="middle"
        filter="url(#rupeeShadow)">₹</text>

  <g fill="#ffffff">
    <path d="M 402 88
             L 409 106
             L 428 114
             L 409 122
             L 402 140
             L 395 122
             L 376 114
             L 395 106 Z"
          opacity="0.95"/>
    <path d="M 106 386
             L 110 396
             L 122 401
             L 110 406
             L 106 416
             L 102 406
             L 90 401
             L 102 396 Z"
          opacity="0.7"/>
  </g>
</svg>
